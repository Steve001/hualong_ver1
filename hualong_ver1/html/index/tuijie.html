	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">我要推介</h1>
			<!--
			<a class="mui-icon iconfont icon-searchIcon1 mui-pull-right" id="search"></a>
			-->
		</header>
		
		<div class="mui-content" action="/TjTest" method="post">
			<form class="mui-input-group">
				<div class="mui-input-row" >
					<label>客户姓名</label>
					<input type="text" name="cusName" class="mui-input-clear" placeholder="被推介人姓名">
				</div>
				<div class="mui-input-row">
					<label>客户性别</label>
					<select name="cusSex">
						<option value="1">男</option>
						<option value="2">女</option>
					</select>
				</div>
				<div class="mui-input-row">
					<label>联系电话</label>
					<input type="number" name="cusPhone" class="mui-input-clear" placeholder="被推介人手机号码">
				</div>
				<div class="mui-input-row">
					<label>意向面积</label>
					<input type="text" name="cusArea" class="mui-input-clear" placeholder="客户意向面积(平米)">
				</div>
				<div class="mui-input-row">
					<label>预计到访</label>
					<input type="text" name="cusDate" class="mui-input-clear" placeholder="预计到访时间(*月*号*点)">
				</div>
				<!--
				<div class="mui-input-row">
					<label>跟办顾问</label>
					<select name="">
						<option value="1">顾问1</option>
						<option value="2">顾问2</option>
						<option value="3">顾问3</option>
					</select>
				</div>
				-->
				<div class="mui-input-row">
					<label>备注</label>
					<textarea name=""  placeholder="请输入备注信息"></textarea>
				</div>
				
				<div class="mui-button-row">
					<button type="submit" id="verify" class="mui-btn mui-btn-primary">确定</button>
					<!--id本来没有 -->
				</div>
				
			</form>
		</div>
